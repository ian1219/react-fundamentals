  <header class="site-header">

      <a class="brand" href="index.html" aria-label="React Fundamentals home">
        <svg class="brand-logo" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="16" cy="16" r="2.7" fill="currentColor" stroke="none"/><ellipse cx="16" cy="16" rx="13" ry="5"/><ellipse cx="16" cy="16" rx="13" ry="5" transform="rotate(60 16 16)"/><ellipse cx="16" cy="16" rx="13" ry="5" transform="rotate(120 16 16)"/></svg>

      </a>
      <nav class="main-nav" aria-label="Main">
        <a href="index.html">Home</a>
        <a href="learn.html" aria-current="page">Lessons</a>
        <a href="playground.html">Playground</a>
        <a href="cheatsheet.html">Cheat Sheet</a>
      </nav>
      <div class="header-actions">
        <button class="icon-btn theme-toggle" type="button" aria-label="Toggle theme">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button class="icon-btn menu-toggle" type="button" aria-label="Open menu" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>

  <div class="learn-layout">
    <aside class="sidebar" id="sidebar" aria-label="Lessons">
      <div class="sidebar-top">
        <div class="progress-label"><span>Your progress</span><span id="progressText">0 / 0</span></div>
        <div class="progress-bar" role="progressbar" aria-label="Lessons completed" aria-valuemin="0" aria-valuemax="100" id="progressBar"><span></span></div>
        <label class="search">
          <span class="sr-only">Search lessons</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="searchInput" type="search" placeholder="Search lessons…" autocomplete="off" />
        </label>
      </div>
      <nav class="lesson-nav" id="lessonNav" aria-label="Lesson list"></nav>
    </aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <main class="lesson-main" id="main">
      <button class="btn btn-ghost btn-sm sidebar-toggle" id="sidebarToggle" type="button" aria-controls="sidebar" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h10M4 18h16"/></svg>
        All lessons
      </button>
      <article class="lesson" id="lesson" tabindex="-1"></article>
    </main>

  <script>window.Prism = window.Prism || {}; window.Prism.manual = true;</script>

  <script src="js/common.js"></script>

  <script src="js/learn.js"></script>
