<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Playground · React Fundamentals</title>
  <meta name="description" content="Write and run React code right in your browser. No installation needed." />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <script>try{var t=localStorage.getItem("rk-theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="pg-page">
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html" aria-label="React Fundamentals home">
        <svg class="brand-logo" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="16" cy="16" r="2.7" fill="currentColor" stroke="none"/><ellipse cx="16" cy="16" rx="13" ry="5"/><ellipse cx="16" cy="16" rx="13" ry="5" transform="rotate(60 16 16)"/><ellipse cx="16" cy="16" rx="13" ry="5" transform="rotate(120 16 16)"/></svg>
        React Fundamentals <small>Learning Kit</small>
      </a>
      <nav class="main-nav" aria-label="Main">
        <a href="index.html">Home</a>
        <a href="learn.html">Lessons</a>
        <a href="playground.html" aria-current="page">Playground</a>
        <a href="cheatsheet.html">Cheat Sheet</a>
      </nav>
      <div class="header-actions">
        <button class="icon-btn theme-toggle" type="button" aria-label="Toggle theme">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button class="icon-btn menu-toggle" type="button" aria-label="Open menu" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
      </div>
    </div>
  </header>

  <div class="pg-toolbar">
    <label for="templateSelect">Example</label>
    <select class="select" id="templateSelect"></select>
    <button class="btn btn-primary btn-sm" id="runBtn" type="button">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4v16l13-8z"/></svg>
      Run
    </button>
    <label class="toggle hide-sm"><input type="checkbox" id="autoRun" checked /> Auto-run</label>
    <span class="pg-spacer"></span>
    <button class="btn btn-ghost btn-sm" id="resetBtn" type="button">Reset</button>
    <button class="btn btn-ghost btn-sm" id="shareBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>
      Copy link
    </button>
    <a class="btn btn-ghost btn-sm hide-sm" id="backLink" href="learn.html">Back to lesson</a>
  </div>

  <div class="pg-split">
    <section class="pane" aria-label="Code editor">
      <div class="pane-head">
        <span>App.jsx</span>
        <span class="status" id="editorHint">Tab inserts spaces · Ctrl+Enter runs</span>
      </div>
      <div class="editor">
        <pre aria-hidden="true"><code class="language-jsx" id="highlight"></code></pre>
        <textarea id="code" wrap="off" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-label="React code"></textarea>
      </div>
    </section>

    <section class="pane" aria-label="Preview">
      <div class="pane-head">
        <span>Preview</span>
        <span class="status" id="status"><span class="led"></span><span>Ready</span></span>
      </div>
      <div class="preview-wrap">
        <iframe id="preview" title="Live preview" sandbox="allow-scripts allow-modals"></iframe>
        <div class="error-overlay" id="errorOverlay" role="alert"></div>
      </div>
      <div class="console" id="console">
        <div class="pane-head">
          <span>Console</span>
          <span class="status">
            <button class="console-head-btn" id="clearConsole" type="button">Clear</button>
            <button class="console-head-btn" id="toggleConsole" type="button" aria-expanded="true">Hide</button>
          </span>
        </div>
        <div class="console-body" id="consoleBody" aria-live="polite"></div>
      </div>
    </section>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script>window.Prism = window.Prism || {}; window.Prism.manual = true;</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-jsx.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/lessons.js"></script>
  <script src="js/playground.js"></script>
</body>
</html>
